name: Build unsigned Android AAB
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned release bundle
        run: pnpm --filter @workspace/estatehold run android:bundle

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: estatehold-release-aab
          path: |
            **/*.aab
            artifacts/estatehold/android/app/build/outputs/bundle/release/*.aab
            **/app/build/outputs/bundle/release/*.aab