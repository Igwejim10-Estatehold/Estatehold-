openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Estatehold property marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: config
  - name: marketplace
  - name: requests
  - name: complaints
  - name: account
  - name: payments
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/supabase:
    get:
      operationId: supabaseHealthCheck
      tags: [health]
      summary: Verify Supabase connectivity
      responses:
        "200":
          description: Supabase is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupabaseHealth"
        "503":
          description: Supabase is unreachable or required schema is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupabaseHealth"
  /config:
    get:
      operationId: getPublicConfig
      tags: [config]
      summary: Public browser configuration
      responses:
        "200":
          description: Public configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfig"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [marketplace]
      summary: Home dashboard content
      responses:
        "200":
          description: Dashboard content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [marketplace]
      summary: Dashboard content and property stats
      responses:
        "200":
          description: Dashboard content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /properties:
    get:
      operationId: listProperties
      tags: [marketplace]
      summary: Browse properties
      parameters:
        - in: query
          name: category
          schema:
            $ref: "#/components/schemas/PropertyCategory"
        - in: query
          name: intent
          schema:
            type: string
            enum: [sale, rent, social]
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
        - in: query
          name: town
          schema:
            type: string
      responses:
        "200":
          description: Property results
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  dataSource:
                    type: string
                    enum: [live, mock]
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Property"
    post:
      operationId: createProperty
      tags: [marketplace]
      summary: Create a property listing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Listing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
  /properties/{propertyId}:
    get:
      operationId: getProperty
      tags: [marketplace]
      summary: Get a property
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Property details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
  /properties/{propertyId}/photos:
    post:
      operationId: createPropertyPhoto
      tags: [marketplace]
      summary: Save a live property verification photo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyPhotoInput"
      responses:
        "201":
          description: Property photo saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyPhoto"
  /properties/{propertyId}/photos/{photoId}/image:
    get:
      operationId: getPropertyVerificationPhoto
      tags: [marketplace]
      summary: Serve a private property verification photo to its owner or an administrator
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - in: path
          name: photoId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Private verification image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          description: Sign-in required
        "403":
          description: Only the property owner or an administrator may view this image
        "404":
          description: Photo not found
  /transactions:
    post:
      operationId: createTransaction
      tags: [payments]
      summary: Create a property transaction and place a delisting lock
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
  /properties/{propertyId}/delisting-requests:
    post:
      operationId: requestPropertyDelisting
      tags: [marketplace]
      summary: Request admin review to delist a property
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "202":
          description: Delisting request queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
  /social-housing:
    get:
      operationId: listSocialHousingUnits
      tags: [marketplace]
      summary: Browse fractional housing units
      responses:
        "200":
          description: Social housing units
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SocialHousingUnit"
  /special-requests:
    get:
      operationId: listSpecialRequests
      tags: [requests]
      summary: List special property requests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Special requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SpecialRequest"
    post:
      operationId: createSpecialRequest
      tags: [requests]
      summary: Request a property or location sourcing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialRequestInput"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialRequest"
  /complaints:
    get:
      operationId: listComplaints
      tags: [complaints]
      summary: List user complaints
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Complaints
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Complaint"
    post:
      operationId: createComplaint
      tags: [complaints]
      summary: Lodge a complaint
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintInput"
      responses:
        "201":
          description: Complaint lodged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
  /account/profile:
    get:
      operationId: getProfile
      tags: [account]
      summary: Get the signed-in user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    put:
      operationId: updateProfile
      tags: [account]
      summary: Create or update the signed-in user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /account/payout-banks:
    get:
      operationId: getPayoutBanks
      tags: [account]
      summary: List Nigerian banks supported by Paystack
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paystack bank directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayoutBank"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Paystack bank directory unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Paystack is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/payout-destination:
    get:
      operationId: getPayoutDestination
      tags: [account]
      summary: Get the signed-in user's masked payout destination
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Masked payout destination, or configured false when none exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutDestination"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /landlord-kyc:
    get:
      operationId: getLandlordKyc
      tags: [account]
      summary: Get the signed-in landlord's KYC and indemnity status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Landlord KYC status without the full NIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandlordKycStatus"
    post:
      operationId: submitLandlordKyc
      tags: [account]
      summary: Submit encrypted landlord identity and ownership documents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LandlordKycInput"
      responses:
        "200":
          description: KYC submitted for admin review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandlordKycStatus"
  /payouts/account:
    post:
      operationId: saveLandlordPayoutAccount
      tags: [account]
      summary: Save payout account after landlord indemnity has been signed
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutDestinationInput"
      responses:
        "200":
          description: Verified payout account saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutDestination"
        "403":
          description: Landlord indemnity is not signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: savePayoutDestination
      tags: [account]
      summary: Verify and securely save the signed-in user's payout destination
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutDestinationInput"
      responses:
        "200":
          description: Verified and saved masked payout destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutDestination"
        "400":
          description: Invalid payout destination details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Paystack could not verify the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Paystack verification service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Paystack is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pricing/quote:
    post:
      operationId: calculateFees
      tags: [payments]
      summary: Calculate property transaction fees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeQuoteInput"
      responses:
        "200":
          description: Fee quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeQuote"
  /pricing/processing-fees:
    get:
      operationId: getProcessingFeeSchedule
      tags: [payments]
      summary: Get public listing and booking processing fees
      responses:
        "200":
          description: Current public processing fee schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingFeeSchedule"
  /installments/quote:
    post:
      operationId: calculateInstallments
      tags: [payments]
      summary: Calculate an installment plan
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallmentQuoteInput"
      responses:
        "200":
          description: Installment plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallmentQuote"
  /payments/initialize:
    post:
      operationId: initializePayment
      tags: [payments]
      summary: Initialize a Paystack test checkout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "200":
          description: Checkout initialization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResult"
  /payments/webhook:
    post:
      operationId: receivePaystackWebhook
      tags: [payments]
      summary: Verify Paystack test events
      parameters:
        - in: header
          name: x-paystack-signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaystackWebhookInput"
      responses:
        "200":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaystackWebhookResult"
  /legal/tenancy-agreement:
    post:
      operationId: createTenancyAgreement
      tags: [account]
      summary: Create a tenancy agreement draft for review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgreementInput"
      responses:
        "201":
          description: Agreement draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agreement"
  /admin/set-role:
    post:
      operationId: assignExecutiveRole
      tags: [admin]
      summary: Assign executive access to an existing profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetExecutiveRoleInput"
      responses:
        "200":
          description: Executive role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetExecutiveRoleResult"
        "403":
          description: Only the account owner may assign executive access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Admin operational overview
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
  /admin/queues/properties:
    get:
      operationId: listAdminPropertyQueue
      tags: [admin]
      summary: List pending properties with their location verification evidence
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending property moderation queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPropertyQueue"
  /admin/properties/{propertyId}/review:
    post:
      operationId: reviewAdminProperty
      tags: [admin]
      summary: Approve or reject a pending property after reviewing its evidence
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPropertyReviewInput"
      responses:
        "200":
          description: Property review decision saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "409":
          description: Property is no longer pending or has no available location photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/queues/delistings:
    get:
      operationId: listAdminDelistingQueue
      tags: [admin]
      summary: List delisting requests awaiting admin review
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Delisting review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDelistingQueue"
  /admin/queues/kyc:
    get:
      operationId: listAdminKycQueue
      tags: [admin]
      summary: List pending account verification requests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: KYC review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKycQueue"
  /admin/queues/landlord-kyc:
    get:
      operationId: listAdminLandlordKycQueue
      tags: [admin]
      summary: List landlord KYC applications for review
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Landlord KYC review queue; full NIN is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLandlordKycQueue"
  /admin/landlord-kyc/{userId}/review:
    post:
      operationId: reviewLandlordKyc
      tags: [admin]
      summary: Approve or reject a landlord KYC application
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewLandlordKycInput"
      responses:
        "200":
          description: Landlord KYC review saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandlordKycReviewResult"
  /admin/queues/escrow:
    get:
      operationId: listAdminEscrowQueue
      tags: [admin]
      summary: List held escrow records
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Held escrow queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEscrowQueue"
  /admin/queues/hotels:
    get:
      operationId: listAdminHotelVerificationQueue
      tags: [admin]
      summary: List hotel and short-let listings awaiting verification
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending hotel verification queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHotelVerificationQueue"
  /admin/hotels/{propertyId}/review:
    post:
      operationId: reviewHotelVerification
      tags: [admin]
      summary: Verify or reject a hotel or short-let listing
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: propertyId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HotelVerificationReviewInput"
      responses:
        "200":
          description: Hotel verification review result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelVerificationReviewResponse"
  /admin/delisting-requests/{requestId}/review:
    post:
      operationId: reviewPropertyDelisting
      tags: [admin]
      summary: Approve or reject a delisting request
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelistingReviewInput"
      responses:
        "200":
          description: Delisting request reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
  /admin/complaints/{complaintId}:
    patch:
      operationId: updateComplaintStatus
      tags: [admin]
      summary: Update complaint investigation status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: complaintId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintReviewInput"
      responses:
        "200":
          description: Complaint status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
  /admin/kyc/{profileId}/review:
    post:
      operationId: reviewKyc
      tags: [admin]
      summary: Approve or reject a KYC submission
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: profileId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycReviewInput"
      responses:
        "200":
          description: KYC review saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
  /admin/escrow/{transactionId}/release:
    post:
      operationId: releaseEscrow
      tags: [admin]
      summary: Release escrow after verification and user confirmation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: transactionId
          required: true
          schema:
            type: string
      responses:
        "409":
          description: Escrow release is disabled pending compliance approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PropertyId:
      in: path
      name: propertyId
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    SupabaseHealth:
      type: object
      required: [supabase, latency]
      properties:
        supabase:
          type: string
          enum: [connected, failed]
        latency:
          type: integer
          minimum: 0
    PublicConfig:
      type: object
      required: [supabaseUrl, supabaseAnonKey, googleMapsApiKey, paystackPublicKey, paymentMode]
      properties:
        supabaseUrl:
          type: string
        supabaseAnonKey:
          type: string
        googleMapsApiKey:
          type: string
        paystackPublicKey:
          type: string
        paymentMode:
          type: string
          enum: [test, disabled]
    PropertyCategory:
      type: string
      enum: [land, home, warehouse, complex, shopping_mall, hotel, short_let, school, hospital, filling_station, worship_center, factory, multipurpose_hall, custom]
    PinStatus:
      type: string
      enum: [verified, pending, dispute, tenant_protected]
    Property:
      type: object
      required: [id, title, category, state, town, priceNaira, intent, pinStatus, isExclusive, isLocked, listingModerationStatus, hotelVerificationStatus, hotelHas24HourReception, hotelCctvCommonAreas, hotelCctvDisclosed, hotelSafetyCheckinAvailable]
      properties:
        id: { type: string }
        title: { type: string }
        category: { $ref: "#/components/schemas/PropertyCategory" }
        customType: { type: string }
        state: { type: string }
        town: { type: string }
        address: { type: string }
        description: { type: string }
        priceNaira: { type: integer, minimum: 0 }
        priceUnit: { type: string }
        intent: { type: string, enum: [sale, rent, lease, social] }
        bedrooms: { type: integer, minimum: 0 }
        bathrooms: { type: integer, minimum: 0 }
